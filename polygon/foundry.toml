[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Surface every warning. The Solana side is enforced by the type system;
# this side is not, so warnings are the only equivalent safety net.
deny_warnings = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
polygon = "${POLYGON_RPC_URL}"
amoy = "${AMOY_RPC_URL}"

[etherscan]
polygon = { key = "${POLYGONSCAN_API_KEY}" }
amoy = { key = "${POLYGONSCAN_API_KEY}", chain = 80002 }
